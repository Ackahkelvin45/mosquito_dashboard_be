name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Fake, CI-only values. Settings (app/core/config.py) requires these at
    # import time; tests run on in-memory SQLite and never reach MQTT/Resend.
    env:
      DATABASE_URL: "sqlite://"
      JWT_SECRET_KEY: ci-only-not-a-secret-just-padding-to-32b
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_TIME: "3600"
      JWT_REFRESH_TOKEN_EXPIRE_SECONDS: "86400"
      RESEND_API_KEY: ci-only-not-a-key
      EMAIL_FROM: ci@example.com
      MQTT_BROKER: localhost
      MQTT_PORT: "1883"
      TOPIC_SENSOR_DATA: mosquito_dashboard/+/sensor_data
      TOPIC_MOSQUITO_COUNT: mosquito_dashboard/+/mosquito_data
      MQTT_CLIENT_ID: ci-client
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13" # same as the Dockerfile (python:3.13-slim)
      - name: Install dependencies (incl. dev group)
        run: uv sync --frozen
      - name: Run tests
        run: uv run pytest -q
