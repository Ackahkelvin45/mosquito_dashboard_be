# Backend test stack (db + broker + api) — runs alongside the normal stack
# on separate ports/volumes. The frontend has its own docker-compose.test.yml
# in mosquito_dashboard_fe; they don't need to share a network or directory
# layout since the deployed frontend calls the API over its public HTTPS URL,
# not the docker network.
#   docker compose -f docker-compose.test.yml up -d --build
name: mosquito-test

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mosquito
      POSTGRES_PASSWORD: mosquito
      POSTGRES_DB: mosquito_dashboard_test
    volumes:
      - postgres_data_test:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mosquito -d mosquito_dashboard_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1884:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -p 1883 -t healthcheck -n -q 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8001:8000"
    env_file:
      - .env.test
    environment:
      DATABASE_URL: postgresql://mosquito:mosquito@db:5432/mosquito_dashboard_test
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_healthy

volumes:
  postgres_data_test:
