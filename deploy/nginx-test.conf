# Reverse proxy for the TEST stack (docker-compose.test.yml), on its own
# subdomains so it never collides with the prod vhosts. Copy into
# /etc/nginx/sites-available/, symlink into sites-enabled/, then:
#   certbot --nginx -d test.mosquitosurveillancedashboard.website -d test.mosquitosurveillancebackend.website
# (certbot rewrites these blocks in place to add the SSL directives + a
# port-80-to-443 redirect — run it once, don't hand-add HTTPS yourself.)

server {
    listen 80;
    server_name test.mosquitosurveillancedashboard.website;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name test.mosquitosurveillancebackend.website;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
